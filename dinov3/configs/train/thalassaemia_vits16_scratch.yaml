# =============================================================================
# DINOv3 — Thalassaemia SSL — ViT-Small/16 — TRAINING FROM SCRATCH
# =============================================================================
# Optimised for Google Colab free tier (T4 GPU, 15 GB VRAM, 1 GPU)
#
# Dataset  : ~3200 thalassaemia microscopy images (3 classes)
# Model    : ViT-Small/16  (~21M parameters)
# Approach : Train the ViT-S SSL from randomly initialised weights
#
# NOTE: With only ~3200 images, from-scratch training may underfit.
#       Start with thalassaemia_vits16_pretrained.yaml for better results.
#
# Launch command (Colab / single GPU):
#   PYTHONPATH=${PWD} python scripts/run_ssl_colab.py \
#     --config-file dinov3/configs/train/thalassaemia_vits16_scratch.yaml \
#     --output-dir outputs/thalassaemia_scratch \
#     train.dataset_path=Thalassaemia:split=TRAIN:root=data/preprocessed:extra=data/preprocessed/metadata
# =============================================================================

MODEL:
  META_ARCHITECTURE: SSLMetaArch
  DEVICE: cuda
  WEIGHTS: ''
  DTYPE: float32

compute_precision:
  param_dtype: bf16          # T4 supports bf16
  reduce_dtype: fp32
  sharding_strategy: SHARD_GRAD_OP

# ------------------------------------------------------------------
# DINO head — scaled down for small dataset (ImageNet uses 65536)
# ------------------------------------------------------------------
dino:
  loss_weight: 1.0
  global_ignore_diagonal: true
  head_n_prototypes: 4096     # <<< scaled for ~3200 images (not 65536)
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1
  koleo_loss_distributed: false
  koleo_topk: 1
  koleo_distributed_replicas: 0
  force_weight_norm: false
  reweight_dino_local_loss: false

# ------------------------------------------------------------------
# iBOT head — masked image modelling
# ------------------------------------------------------------------
ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.5
  mask_random_circular_shift: false
  force_masking_even_with_zero_weight: false
  separate_head: true
  head_n_prototypes: 4096     # <<< scaled for small dataset
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048

# GRAM not used (reserved for larger models)
gram:
  use_loss: false
  compute_stats: false

# ------------------------------------------------------------------
# Training settings
# ------------------------------------------------------------------
train:
  batch_size_per_gpu: 16       # Safe for T4 (15 GB VRAM) with ViT-S
  dataset_path: Thalassaemia:split=TRAIN:root=data/preprocessed:extra=data/preprocessed/metadata
  output_dir: outputs/thalassaemia_scratch
  saveckp_freq: 20
  seed: 42
  num_workers: 2               # Colab has limited CPUs
  OFFICIAL_EPOCH_LENGTH: 200   # ≈ total_images / batch_size / num_local_crops
  monitor_gradient_norm: true
  chunk_schedule: []
  use_teacher_head: true
  learn_from_teacher_tokens: false
  centering: sinkhorn_knopp
  checkpointing: false         # Gradient checkpointing — off for small model on T4
  checkpointing_full: false
  compile: false               # torch.compile can be unstable on Colab; set true if torch>=2.1
  cudagraphs: false
  cache_dataset: false         # Small dataset, no need
  cell_augmentation: false
  cell_augmentation_type: hpa
  sharded_eval_checkpoint: false

# ------------------------------------------------------------------
# Student (ViT-Small/16 — from scratch)
# ------------------------------------------------------------------
student:
  arch: vit_small              # 21M params — appropriate for ~3200 images
  patch_size: 16
  drop_path_rate: 0.1          # Lower stochastic depth for small model
  layerscale: 1.0e-04
  patch_drop: 0.0
  pretrained_weights: ''       # Empty = random init (from scratch)
  ffn_layer: mlp
  ffn_ratio: 4.0
  resume_from_teacher_chkpt: ''
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  norm_layer: layernorm
  n_storage_tokens: 0
  mask_k_bias: false
  untie_cls_and_patch_norms: false
  untie_global_and_local_cls_norm: false
  in_chans: 3
  pos_embed_type: rope
  pos_embed_rope_base: 100.0
  pos_embed_rope_normalize_coords: separate
  pos_embed_rope_dtype: bf16
  fp8_enabled: false           # T4 does NOT support fp8

# ------------------------------------------------------------------
# Teacher EMA
# ------------------------------------------------------------------
teacher:
  momentum_teacher: 0.992
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 30
  in_chans: 3

# Distillation disabled
distillation:
  enabled: false
  full_cfg_path: ''
  checkpoint_path: ''
multidistillation:
  enabled: false
hrft:
  enabled: false
  checkpoint_path: ''

# ------------------------------------------------------------------
# Optimiser
# ------------------------------------------------------------------
optim:
  epochs: 200                  # More epochs compensates for small dataset
  optimizer: adamw
  weight_decay: 0.04
  weight_decay_end: 0.2
  lr: 0.0005                   # Scaled down from 0.001 (smaller batch)
  warmup_epochs: 10
  min_lr: 1.0e-06
  schedule_trunc_extra: 0.0
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  dino_head_wd_multiplier: 1.0
  layerwise_decay: 0.9
  multi_tensor_optim: true
  dump_fsdp_weights_path: ''
  adamw_beta1: 0.9
  adamw_beta2: 0.999

# ------------------------------------------------------------------
# Multi-crop augmentation
# ------------------------------------------------------------------
crops:
  global_crops_scale:
  - 0.32
  - 1.0
  local_crops_number: 6        # Reduced from 8 for memory efficiency on T4
  local_crops_scale:
  - 0.05
  - 0.32
  global_crops_size: 224
  local_crops_size: 96
  localcrops_subset_of_globalcrops: false
  share_color_jitter: false
  horizontal_flips: true       # Horizontal flip is valid for blood smear images
  rgb_mean:
  - 0.485
  - 0.456
  - 0.406
  rgb_std:
  - 0.229
  - 0.224
  - 0.225
  # NOTE: After running preprocess_data.py, check metadata/dataset_stats.json
  #       and update rgb_mean/rgb_std above with domain-specific values
  #       for slightly better convergence.

# ------------------------------------------------------------------
# Periodic evaluation during training
# ------------------------------------------------------------------
evaluation:
  eval_period_iterations: 2000   # Save teacher checkpoint every 2000 iters for eval
  low_freq_every: 5
  config_files:
    high_freq: benchmark_high_frequency.yaml
    low_freq: benchmark_low_frequency.yaml

# ------------------------------------------------------------------
# Checkpointing
# ------------------------------------------------------------------
checkpointing:
  period: 1000
  max_to_keep: 3
  keep_every: 99999999           # Keep all checkpoints (small training)

# ------------------------------------------------------------------
# WandB — controlled via environment variables:
#   export WANDB_PROJECT=thalassaemia-dinov3
#   export WANDB_RUN_NAME=vits16-scratch
#   export WANDB_ENABLED=true
# ------------------------------------------------------------------
wandb:
  enabled: true
  project: thalassaemia-dinov3
  run_name: vits16-scratch
  tags:
  - thalassaemia
  - dinov3
  - vit-small
  - from-scratch
  - ssl
