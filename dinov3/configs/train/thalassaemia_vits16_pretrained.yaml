# =============================================================================
# DINOv3 — Thalassaemia SSL — ViT-Small/16 — CONTINUE FROM PRETRAINED WEIGHTS
# =============================================================================
# Optimised for Google Colab free tier (T4 GPU, 15 GB VRAM, 1 GPU)
#
# Dataset  : ~3200 thalassaemia microscopy images (3 classes)
# Model    : ViT-Small/16  (~21M parameters, distilled from DINOv3 ViT-7B)
# Approach : Continue SSL pretraining from Meta's pretrained ViT-S/16 weights
#
# *** RECOMMENDED over from-scratch for your dataset size (~3200 images) ***
#
# Step 1: Download ViT-S/16 pretrained weights from Meta
#   https://ai.meta.com/resources/models-and-libraries/dinov3-downloads/
#   (requires Meta approval — use wget once you have the URL)
#   Alternatively, use HuggingFace:
#   python -c "
#   from huggingface_hub import hf_hub_download
#   hf_hub_download('facebook/dinov3-vits16-pretrain-lvd1689m', 'model.safetensors',
#                   local_dir='checkpoints/dinov3_vits16_pretrained')
#   "
#
# Step 2: Set pretrained_weights below (or pass via CLI):
#   train.student.pretrained_weights=checkpoints/dinov3_vits16_pretrained/model.safetensors
#
# Launch command (Colab / single GPU):
#   PYTHONPATH=${PWD} python scripts/run_ssl_colab.py \
#     --config-file dinov3/configs/train/thalassaemia_vits16_pretrained.yaml \
#     --output-dir outputs/thalassaemia_pretrained \
#     train.dataset_path=Thalassaemia:split=TRAIN:root=data/preprocessed:extra=data/preprocessed/metadata \
#     student.pretrained_weights=checkpoints/dinov3_vits16_pretrained/model.safetensors
# =============================================================================

MODEL:
  META_ARCHITECTURE: SSLMetaArch
  DEVICE: cuda
  WEIGHTS: ''
  DTYPE: float32

compute_precision:
  param_dtype: bf16           # T4 supports bf16
  reduce_dtype: fp32
  sharding_strategy: SHARD_GRAD_OP

# ------------------------------------------------------------------
# DINO head — scaled for small dataset
# ------------------------------------------------------------------
dino:
  loss_weight: 1.0
  global_ignore_diagonal: true
  head_n_prototypes: 4096     # <<< scaled for ~3200 images
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1
  koleo_loss_distributed: false
  koleo_topk: 1
  koleo_distributed_replicas: 0
  force_weight_norm: false
  reweight_dino_local_loss: false

# ------------------------------------------------------------------
# iBOT head
# ------------------------------------------------------------------
ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.5
  mask_random_circular_shift: false
  force_masking_even_with_zero_weight: false
  separate_head: true
  head_n_prototypes: 4096     # <<< scaled for small dataset
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048

gram:
  use_loss: false
  compute_stats: false

# ------------------------------------------------------------------
# Training settings
# ------------------------------------------------------------------
train:
  batch_size_per_gpu: 16
  dataset_path: Thalassaemia:split=TRAIN:root=data/preprocessed:extra=data/preprocessed/metadata
  output_dir: outputs/thalassaemia_pretrained
  saveckp_freq: 20
  seed: 42
  num_workers: 2
  OFFICIAL_EPOCH_LENGTH: 200
  monitor_gradient_norm: true
  chunk_schedule: []
  use_teacher_head: true
  learn_from_teacher_tokens: false
  centering: sinkhorn_knopp
  checkpointing: false
  checkpointing_full: false
  compile: false              # Colab compatibility
  cudagraphs: false
  cache_dataset: false
  cell_augmentation: false
  cell_augmentation_type: hpa
  sharded_eval_checkpoint: false

# ------------------------------------------------------------------
# Student (ViT-Small/16 — from pretrained DINOv3 weights)
# ------------------------------------------------------------------
student:
  arch: vit_small
  patch_size: 16
  drop_path_rate: 0.1
  layerscale: 1.0e-04
  patch_drop: 0.0
  # *** SET THIS PATH TO YOUR DOWNLOADED CHECKPOINT ***
  # Supported formats: .pth, .safetensors
  pretrained_weights: 'checkpoints/dinov3_vits16_pretrained/model.safetensors'
  ffn_layer: mlp
  ffn_ratio: 4.0
  resume_from_teacher_chkpt: ''
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  norm_layer: layernorm
  n_storage_tokens: 0
  mask_k_bias: false
  untie_cls_and_patch_norms: false
  untie_global_and_local_cls_norm: false
  in_chans: 3
  pos_embed_type: rope
  pos_embed_rope_base: 100.0
  pos_embed_rope_normalize_coords: separate
  pos_embed_rope_dtype: bf16
  fp8_enabled: false          # T4 does NOT support fp8

# ------------------------------------------------------------------
# Teacher EMA
# Momentum slightly higher than scratch — features are already good
# ------------------------------------------------------------------
teacher:
  momentum_teacher: 0.996     # Higher momentum — teacher is already strong
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 10  # Shorter warmup — already pretrained
  in_chans: 3

distillation:
  enabled: false
  full_cfg_path: ''
  checkpoint_path: ''
multidistillation:
  enabled: false
hrft:
  enabled: false
  checkpoint_path: ''

# ------------------------------------------------------------------
# Optimiser — lower LR for fine-tuning (10x less than scratch)
# ------------------------------------------------------------------
optim:
  epochs: 100                 # Fewer epochs needed — already pretrained
  optimizer: adamw
  weight_decay: 0.04
  weight_decay_end: 0.2
  lr: 0.00005                 # 10x lower than scratch — fine-tuning regime
  warmup_epochs: 5            # Short warmup for fine-tuning
  min_lr: 1.0e-07
  schedule_trunc_extra: 0.0
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  dino_head_wd_multiplier: 1.0
  layerwise_decay: 0.9        # Strong layerwise decay to protect pretrained features
  multi_tensor_optim: true
  dump_fsdp_weights_path: ''
  adamw_beta1: 0.9
  adamw_beta2: 0.999

# ------------------------------------------------------------------
# Multi-crop augmentation
# ------------------------------------------------------------------
crops:
  global_crops_scale:
  - 0.32
  - 1.0
  local_crops_number: 6       # 6 local crops (8 is default, reduced for Colab memory)
  local_crops_scale:
  - 0.05
  - 0.32
  global_crops_size: 224
  local_crops_size: 96
  localcrops_subset_of_globalcrops: false
  share_color_jitter: false
  horizontal_flips: true
  rgb_mean:
  - 0.485
  - 0.456
  - 0.406
  rgb_std:
  - 0.229
  - 0.224
  - 0.225
  # NOTE: These are ImageNet stats — use your domain stats from
  #       data/preprocessed/metadata/dataset_stats.json for better fine-tuning.

evaluation:
  eval_period_iterations: 2000
  low_freq_every: 5
  config_files:
    high_freq: benchmark_high_frequency.yaml
    low_freq: benchmark_low_frequency.yaml

checkpointing:
  period: 1000
  max_to_keep: 3
  keep_every: 99999999

# ------------------------------------------------------------------
# WandB
# ------------------------------------------------------------------
wandb:
  enabled: true
  project: thalassaemia-dinov3
  run_name: vits16-pretrained
  tags:
  - thalassaemia
  - dinov3
  - vit-small
  - fine-tuning
  - ssl
